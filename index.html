<style>
:root{--bg:#fafafa;--card:#fff;--ink:#1b1f27;--mut:#77808f;--acc:#1f4d43;--line:#e6e8ec;--ok:#2e7d5b;--ko:#b4413f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101318;--card:#171b22;--ink:#eceef2;--mut:#8b93a3;--acc:#7fc4ae;--line:#252a33}}
:root[data-theme="dark"]{--bg:#101318;--card:#171b22;--ink:#eceef2;--mut:#8b93a3;--acc:#7fc4ae;--line:#252a33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:600px;margin:0 auto;padding:20px 16px 60px}
h1{font:600 30px/1.1 Fraunces,Georgia,serif;letter-spacing:-.01em;margin:4px 0}
.sub{color:var(--mut);margin:6px 0;font-size:15px}
.bar{height:2px;background:var(--line);margin-top:14px}.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
.stats{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin:8px 0 6px}
nav{display:flex;border-bottom:1px solid var(--line);margin-bottom:18px}
nav button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 2px;color:var(--mut);font:inherit;font-size:13px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
button:focus-visible,input:focus-visible,summary:focus-visible,.scene:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.card,.face{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:28px 22px}
.card{margin-bottom:14px}.mid{text-align:center}
.emo{font-size:44px;line-height:1.2}
.en{font:600 28px/1.2 Fraunces,Georgia,serif;margin:8px 0}.en.s{font-size:18px;color:var(--mut)}
.lv{font-size:13px;color:var(--mut)}
.fr{font-size:19px;color:var(--acc);margin:10px 0}
.ex{font-style:italic;margin:10px 0}
.or{color:var(--mut);font-size:15px;border-left:1px solid var(--acc);padding-left:12px;margin:10px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{padding:11px 18px;border-radius:6px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--bg)}
.ic{background:none;border:0;font-size:18px;cursor:pointer;padding:2px 6px;vertical-align:middle}
.scene{perspective:1200px;cursor:pointer}
.fl{display:grid;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.fl.on{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:330px;display:flex;flex-direction:column;justify-content:center}
.back{transform:rotateY(180deg)}
.wrap:not(.on) .rate{visibility:hidden}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;font:inherit;cursor:pointer}
.opt.good{border-color:var(--ok);color:var(--ok)}.opt.bad{border-color:var(--ko);color:var(--ko)}.opt.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.mode{text-align:left;padding:14px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:6px;font:inherit;cursor:pointer}
.mode span{display:block;font-size:13px;color:var(--mut)}
.chk{font-size:14px;color:var(--mut)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tp,input[type=search]{width:100%;padding:12px;border:1px solid var(--line);border-bottom-color:var(--ink);border-radius:4px;background:var(--card);color:var(--ink);font:inherit;margin:10px 0}
.tm{float:right;color:var(--mut);font-size:14px}
.chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chips button{padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:none;color:var(--mut);font:inherit;font-size:14px;cursor:pointer}
.chips button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
details{border-bottom:1px solid var(--line);padding:12px 2px}summary{cursor:pointer}
.k{color:var(--ok)}
.bds{display:flex;gap:8px;flex-wrap:wrap}
.bd{border:1px solid var(--line);border-radius:20px;padding:3px 12px;font-size:13px;color:var(--mut)}.bd.on{color:var(--ink);border-color:var(--acc)}
.big{font:600 46px Fraunces,Georgia,serif}
.top{display:flex;justify-content:space-between;align-items:center}.out .bar,.out .stats{display:none}label.sub{display:block;margin-top:10px}.err{color:var(--ko);font-size:14px;min-height:1.3em;margin:4px 0}.btn.dng{border-color:var(--ko);color:var(--ko)}
#t{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none}
#t.show{animation:tt 1.6s}
@keyframes tt{0%{opacity:0;transform:translate(-50%,8px)}15%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.fl,.bar i{transition:none}#t.show{animation:none;opacity:1}}
</style>
</head>

<script>
var D=[
["Break the ice","Briser la glace","Facile","He told a joke to break the ice.","Des navires ouvraient la glace pour laisser passer les autres bateaux."],
["Piece of cake","C'est du gâteau / les doigts dans le nez","Facile","The exam was a piece of cake.","Expression américaine des années 1930 : le gâteau symbolise ce qui se mange sans effort."],
["Under the weather","Ne pas être dans son assiette","Facile","I'm feeling under the weather today.","Selon une théorie, les marins malades descendaient sous le pont, à l'abri du mauvais temps."],
["Hit the books","Se mettre à réviser","Facile","I need to hit the books tonight.","Argot étudiant américain du début du XXe siècle."],
["Spill the beans","Vendre la mèche","Facile","Don't spill the beans about the surprise!","Selon une théorie, dans la Grèce antique on votait avec des fèves : renverser le pot révélait le résultat."],
["Once in a blue moon","Tous les 36 du mois","Facile","We go out for dinner once in a blue moon.","Une « lune bleue » est une deuxième pleine lune dans un même mois, phénomène rare."],
["Cost an arm and a leg","Coûter les yeux de la tête","Facile","That phone costs an arm and a leg.","Origine incertaine, probablement américaine, XXe siècle."],
["Bite the bullet","Serrer les dents et s'y résoudre","Intermédiaire","I'll just bite the bullet and tell him.","Selon la légende, des soldats mordaient une balle pendant une opération sans anesthésie."],
["The ball is in your court","C'est à toi de jouer","Intermédiaire","I made my offer. The ball is in your court.","Vient du tennis : c'est au joueur dont la balle est dans son camp de jouer."],
["Burn the midnight oil","Veiller tard pour travailler","Intermédiaire","She burned the midnight oil to finish her essay.","Avant l'électricité, on travaillait la nuit à la lampe à huile."],
["Let the cat out of the bag","Révéler un secret","Intermédiaire","Who let the cat out of the bag?","Selon une théorie, des marchands glissaient un chat au lieu d'un porcelet dans le sac ; l'ouvrir révélait la tromperie."],
["Throw in the towel","Jeter l'éponge","Intermédiaire","After three failures, he threw in the towel.","Vient de la boxe : le soigneur jette une serviette pour arrêter le combat."],
["A blessing in disguise","Un mal pour un bien","Intermédiaire","Losing that job was a blessing in disguise.","Attestée dès 1746 dans un poème de James Hervey."],
["Beat around the bush","Tourner autour du pot","Intermédiaire","Stop beating around the bush and tell me.","Des rabatteurs frappaient les buissons pour faire sortir le gibier sans s'approcher directement."],
["Cut corners","Bâcler le travail","Intermédiaire","The company cut corners on safety.","Couper les angles d'un trajet fait gagner du temps, mais au détriment de la qualité."],
["Bite off more than you can chew","Avoir les yeux plus gros que le ventre","Avancé","I bit off more than I could chew with three clubs.","Américain, début du XIXe siècle : mordre un morceau trop gros pour la bouche."],
["Add insult to injury","Ajouter l'insulte au préjudice","Avancé","He forgot my birthday, then laughed about it. Adding insult to injury!","Remonte à une fable de Phèdre, reprise en anglais au XVIIIe siècle."],
["The elephant in the room","Le sujet que tout le monde évite","Avancé","Nobody mentioned the elephant in the room: the layoffs.","Popularisée par une fable de Krylov (1814) où un homme ne remarque pas un éléphant."],
["Steal someone's thunder","Voler la vedette à quelqu'un","Avancé","She stole my thunder by announcing the news first.","Le dramaturge John Dennis inventa une machine à tonnerre en 1709 ; un rival l'utilisa dans sa propre pièce."],
["Play devil's advocate","Jouer l'avocat du diable","Avancé","Let me play devil's advocate for a second.","Rôle officiel de l'Église catholique : contester une canonisation pour tester les arguments."],
